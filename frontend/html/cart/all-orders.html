<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tất cả đơn hàng - TAM TAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/cart/all-orders.css">
  <link rel="stylesheet" href="http://127.0.0.1:8000/chatbot-assets/chatbot-widget.css?v=20260522c">
</head>
<body>
  <header class="site-header">
    <div class="top-strip"></div>
    <div class="main-header">
      <a href="../core/landing.html" class="logo-box" aria-label="Trang Landing">
        <img src="../../images/modern-logo-with-gradient-squares.png" alt="TAM TAI Logo">
      </a>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="orderSearch" placeholder="Tìm kiếm theo mã đơn hàng">
      </div>

      <div class="header-icons">
        <a href="../user/notification.html" aria-label="Thông báo"><i class="fa-solid fa-bell"></i></a>
        <a href="cart.html" aria-label="Giỏ hàng"><i class="fa-solid fa-cart-shopping"></i></a>
        <a href="../user/profile.html" aria-label="Tài khoản"><i class="fa-solid fa-user"></i></a>
      </div>
    </div>
  </header>

  <main class="page-wrap">
    <div class="orders-shell">
      <div class="orders-head">
        <h1>Tất cả đơn hàng</h1>
        <a href="../user/profile.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Quay lại trang tài khoản</a>
      </div>

      <div class="orders-filters" id="ordersFilters">
        <button class="active" data-status="all">Tất cả</button>
        <button data-status="pending">Chờ xác nhận</button>
        <button data-status="shipping">Đang giao</button>
        <button data-status="delivered">Đã giao</button>
        <button data-status="cancelled">Đã hủy</button>
      </div>

      <p class="orders-summary" id="ordersSummary">Hiển thị 0 - 0 / 0 đơn hàng</p>

      <section class="orders-table">
        <div class="order-row order-head-row">
          <span>Mã đơn</span>
          <span>Ngày đặt</span>
          <span>Sản phẩm</span>
          <span>Tổng tiền</span>
          <span>Trạng thái</span>
          <span>Thao tác</span>
        </div>
        <div id="ordersBody"></div>
      </section>

      <div class="pagination" id="pagination"></div>
    </div>
  </main>

    <footer class="site-footer">
    <div class="footer-col">
      <h3>Về Website</h3>
      <a href="../info/privacy-policy.html">Chính sách bảo mật</a>
      <a href="../info/operating-regulations.html">Quy chế hoạt động</a>
    </div>
    <div class="footer-col">
      <h3>Liên kết</h3>
      <a href="../info/promotions.html">Khuyến mãi hôm nay</a>
      <a href="../core/landing.html#featured-categories">Danh mục nổi bật</a>
    </div>
    <div class="footer-col">
      <h3>Hỗ trợ</h3>
      <a href="../info/help-center.html">Trung tâm trợ giúp</a>
      <a href="../info/faq.html">Câu hỏi thường gặp</a>
    </div>
    <div class="footer-col">
      <h3>Theo dõi</h3>
      <a href="https://www.facebook.com/tran.co.cow/" target="_blank" rel="noopener noreferrer">Facebook</a>
      <a href="https://www.tiktok.com/@ctran771?lang=en" target="_blank" rel="noopener noreferrer">TikTok</a>
    </div>
  </footer>

  <script src="../../js/core/common.js?v=20260522f"></script>
  <script src="http://127.0.0.1:8000/chatbot-assets/chatbot-widget.js?v=20260522c"></script>
  <script src="../../js/cart/all-orders.js?v=20260522g"></script>
